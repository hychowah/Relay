services:
  relay:
    build: .
    init: true
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      RELAY_PROVIDER: ${RELAY_PROVIDER:-fixture}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      RELAY_APPS_FILE: ${RELAY_APPS_FILE:+/run/relay-apps.json}
    volumes:
      - relay-data:/data
      - ./secrets:/run/secrets:ro
      - type: bind
        source: ${RELAY_APPS_FILE:-./apps.example.json}
        target: /run/relay-apps.json
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3210/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
volumes:
  relay-data:
